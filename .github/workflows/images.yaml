        platforms: linux/amd64,linux/arm64/v8
        push: true
        cache-from: type=registry,ref=ghcr.io/yolean/node-kafka:_buildcache-root
        cache-to: ${{ env.FLOATING == 'true' && 'type=registry,ref=ghcr.io/yolean/node-kafka:_buildcache-root,mode=max' || '' }}
        build-contexts: |
          yolean/node:root=docker-image://ghcr.io/yolean/node:${{ github.sha }}-root
      continue-on-error: false
      timeout-minutes: 45
    -
      name: Build and push node-kafka latest
