        platforms: linux/amd64,linux/arm64/v8
        push: true
        cache-from: type=registry,ref=ghcr.io/yolean/node-kafka-cache:_buildcache-root
        cache-to: ${{ env.FLOATING == 'true' && 'type=registry,ref=ghcr.io/yolean/node-kafka-cache:_buildcache-root,mode=max' || '' }}
        build-contexts: |
